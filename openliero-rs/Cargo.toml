[workspace]
resolver = "2"
members = [
    "crates/liero-data",
    "crates/liero-sim",
    "crates/liero-render",
    "crates/liero-net",
    "crates/liero-audio",
    "crates/liero-mod",
    "crates/liero-desktop",
    "crates/liero-web",
    "tools/tc-validator",
    "tools/replay-diff",
    "tools/liero-relay",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["OpenLiero contributors"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/openliero/openliero"

[workspace.dependencies]
liero-data   = { path = "crates/liero-data" }
liero-sim    = { path = "crates/liero-sim" }
liero-render = { path = "crates/liero-render" }
liero-net    = { path = "crates/liero-net" }
liero-audio  = { path = "crates/liero-audio" }
liero-mod    = { path = "crates/liero-mod" }

serde        = { version = "1", features = ["derive"] }
toml         = { version = "0.8" }
anyhow       = { version = "1" }
thiserror    = { version = "2" }

wgpu         = "24"
winit        = "0.30"
bytemuck     = { version = "1", features = ["derive"] }
pollster     = "0.3"
