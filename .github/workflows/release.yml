name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── macOS ───────────────────────────────────────────────────────────────────
  build-macos:
    name: Build — macOS (ARM64 + x86_64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            openliero-rs/target
          key: macos-cargo-${{ hashFiles('openliero-rs/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Build (ARM64)
        run: cargo build --release --manifest-path openliero-rs/Cargo.toml -p liero-desktop --target aarch64-apple-darwin

      - name: Build (x86_64)
        run: cargo build --release --manifest-path openliero-rs/Cargo.toml -p liero-desktop --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            openliero-rs/target/aarch64-apple-darwin/release/openliero \
            openliero-rs/target/x86_64-apple-darwin/release/openliero \
            -output openliero-universal

      - name: Assemble .app bundle
        run: |
          APP=OpenLiero.app
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp openliero-universal "$APP/Contents/MacOS/openliero"
          chmod +x "$APP/Contents/MacOS/openliero"
          cp pkg/liero.icns "$APP/Contents/Resources/"

          # Copy TC
          mkdir -p "$APP/Contents/Resources/TC"
          cp -r TC/openliero "$APP/Contents/Resources/TC/openliero"

          # Info.plist
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>           <string>OpenLiero</string>
            <key>CFBundleDisplayName</key>    <string>OpenLiero</string>
            <key>CFBundleIdentifier</key>     <string>com.openliero.game</string>
            <key>CFBundleVersion</key>        <string>1</string>
            <key>CFBundleShortVersionString</key> <string>1.0</string>
            <key>CFBundleExecutable</key>     <string>openliero</string>
            <key>CFBundleIconFile</key>       <string>liero.icns</string>
            <key>CFBundlePackageType</key>    <string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key> <string>12.0</string>
          </dict>
          </plist>
          PLIST

      - name: Package macOS zip
        run: zip -r OpenLiero-macOS.zip OpenLiero.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLiero-macOS
          path: OpenLiero-macOS.zip

  # ── Linux ───────────────────────────────────────────────────────────────────
  build-linux:
    name: Build — Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            openliero-rs/target
          key: linux-cargo-${{ hashFiles('openliero-rs/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Build
        run: cargo build --release --manifest-path openliero-rs/Cargo.toml -p liero-desktop

      - name: Assemble Linux package
        run: |
          mkdir -p dist/openliero/TC
          cp openliero-rs/target/release/openliero dist/openliero/
          cp -r TC/openliero dist/openliero/TC/openliero
          tar czf OpenLiero-linux.tar.gz -C dist openliero

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLiero-linux
          path: OpenLiero-linux.tar.gz

  # ── Windows ─────────────────────────────────────────────────────────────────
  build-windows:
    name: Build — Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            openliero-rs/target
          key: windows-cargo-${{ hashFiles('openliero-rs/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build
        run: cargo build --release --manifest-path openliero-rs/Cargo.toml -p liero-desktop

      - name: Assemble Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\openliero\TC | Out-Null
          Copy-Item openliero-rs\target\release\openliero.exe dist\openliero\
          Copy-Item -Recurse TC\openliero dist\openliero\TC\openliero
          Compress-Archive -Path dist\openliero -DestinationPath OpenLiero-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLiero-windows
          path: OpenLiero-windows.zip

  # ── GitHub Release + Itch.io ────────────────────────────────────────────────
  publish:
    name: Publish
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/OpenLiero-macOS/OpenLiero-macOS.zip
            artifacts/OpenLiero-linux/OpenLiero-linux.tar.gz
            artifacts/OpenLiero-windows/OpenLiero-windows.zip
          generate_release_notes: true

      - name: Install butler
        run: |
          curl -L -o butler.zip \
            "https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default"
          unzip butler.zip
          chmod +x butler
          ./butler --version

      - name: Push to Itch.io — macOS
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push \
            artifacts/OpenLiero-macOS/OpenLiero-macOS.zip \
            rubencora/openliero:mac \
            --userversion "${{ github.ref_name }}"

      - name: Push to Itch.io — Linux
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push \
            artifacts/OpenLiero-linux/OpenLiero-linux.tar.gz \
            rubencora/openliero:linux \
            --userversion "${{ github.ref_name }}"

      - name: Push to Itch.io — Windows
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push \
            artifacts/OpenLiero-windows/OpenLiero-windows.zip \
            rubencora/openliero:windows \
            --userversion "${{ github.ref_name }}"
