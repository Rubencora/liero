<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenLiero</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      color: #aaa;
    }
    canvas {
      /* Scale up the 640×400 canvas to fit the viewport, preserving aspect ratio */
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid #333;
    }
    #hint {
      margin-top: 8px;
      font-size: 11px;
      color: #444;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="640" height="400"></canvas>
  <div id="hint">Loading…</div>

  <script type="module">
    import init from './pkg/liero_web.js';

    async function run() {
      try {
        await init();
        document.getElementById('hint').textContent =
          'P1: Arrows + LCtrl/LShift/Space  |  P2: IJKL + Enter/RShift/RCtrl';
      } catch (e) {
        document.getElementById('hint').textContent = 'Error: ' + e;
        console.error(e);
      }
    }

    run();
  </script>
</body>
</html>
