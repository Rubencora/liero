# nginx virtual host for liero.byruben.io
# Deploy: scp this file to /etc/nginx/sites-available/liero.byruben.io on the VPS,
# then: ln -sf /etc/nginx/sites-available/liero.byruben.io /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name liero.byruben.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name liero.byruben.io;

    ssl_certificate     /etc/letsencrypt/live/liero.byruben.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liero.byruben.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/liero;
    index index.html;

    # Compress WASM and JS (WASM binary is ~8-15 MB, gzip brings it to ~3-5 MB)
    gzip on;
    gzip_types application/wasm text/javascript application/javascript text/css;
    gzip_min_length 1024;

    # Landing page
    location / {
        try_files $uri $uri/ =404;
    }

    # WebSocket proxy to liero-relay (port 7778)
    # Enables future WASM browser clients to connect via wss://liero.byruben.io/relay/
    location /relay/ {
        proxy_pass         http://127.0.0.1:7778/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 300s;
    }

    # Cache static assets
    location ~* \.(css|js|wasm|png|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Deny hidden files
    location ~ /\. { deny all; }
}
